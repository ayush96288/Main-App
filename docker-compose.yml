services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: scribelink
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: [scribelink_pg:/var/lib/postgresql/data]
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: miniosecret
    ports: ["9000:9000","9001:9001"]
    volumes: [scribelink_objects:/data]
volumes:
  scribelink_pg:
  scribelink_objects:
